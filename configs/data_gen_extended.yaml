# ThinkSpark-v2-350M — EXTENDED-length data generation (additive to the main corpus).
#
# Purpose: the original corpus (configs/data_gen.yaml) produced very short user turns
# (<1-2 s each), so almost every training window was pinned at the ~1.3 s floor and the
# model never saw the temporal dynamics that turn-taking/endpointing actually depend on.
# This config generates a SEPARATE, additive set of longer user turns (~3-8 s) so the
# model learns realistic endpointing, mid-utterance pauses (barge_lookalike), and
# backchannel-during-speech timing. Your existing scenarios + audio are left untouched
# and still used in training — this is added on top, not a replacement.
#
# The ONLY substantive change vs. data_gen.yaml is `utterance_length: extended` (which
# makes the LLM write longer user_text) plus `avg_window_seconds` retuned so the
# hours->count sizing is right for longer clips. Everything else (LLM, Soniox, pricing)
# is intentionally identical.
#
# Run it into its OWN output files so nothing collides with the main corpus:
#   python scripts/02_generate_scripts.py --config configs/data_gen_extended.yaml \
#       --plan-dir data/plan_extended --out-dir data/scenarios_extended
#   python scripts/03_render_user_audio.py --config configs/data_gen_extended.yaml \
#       --in data/scenarios_extended/scenarios_all.jsonl --audio-dir data/audio_extended
#   python scripts/00_encode_audio.py --config configs/data_gen_extended.yaml \
#       --audio-dir data/audio_extended --out-dir data/encoded
#   python scripts/04_build_frames.py --config configs/data_gen_extended.yaml \
#       --in data/scenarios_extended/scenarios_all.jsonl --audio-dir data/audio_extended \
#       --frames-out data/frames/frames_extended.jsonl
# (training globs data/frames/*.jsonl, so the extended frames join the corpus there.)

# total_hours is THE size knob: scenarios = total_hours * 3600 / avg_window_seconds.
# At 5.5 s/clip: 5h->~3.3k, 10h->~6.5k, 15h->~9.8k, 20h->~13k clips. Raise it to make
# a bigger target; the run is resumable, so bumping it just tops up toward the new total.
# NOTE: to add many HOURS efficiently, prefer configs/data_gen_long.yaml (12-25 s clips)
# — same hours with ~3x fewer clips => far fewer LLM calls and Soniox stream starts.
total_hours: 15.0               # ~9.8k extended scenarios (~15 h of 3-8 s audio)
avg_window_seconds: 5.5         # mean of the 3-8 s extended band (drives count<-hours)
utterance_length: extended      # <-- the switch: longer user_text (thinkspark.vocab)

# ---- LLM (identical to data_gen.yaml) ---------------------------------------
llm_model: "gemma-4-31b-it"
llm_base_url: "https://cloud.olakrutrim.com/v1"
llm_temperature: 0.9
llm_max_tokens: 1600            # a little higher — longer user_text per item
llm_max_retries: 5
llm_concurrency: 30
batch_size: 12

judge_model: "gemma-4-31b-it"

# ---- Soniox TTS (identical to data_gen.yaml) --------------------------------
soniox_ws_url: "wss://tts-rt.soniox.com/tts-websocket"
soniox_model: "tts-rt-v2"
soniox_sample_rate: 24000
soniox_max_retries: 5
soniox_concurrency: 3

mimi_repo: "kyutai/mimi"
mimi_sample_rate: 24000

num_parts: 8
seed: 1234

behaviour_shares: {}
language_shares: {}
domain_shares: {}

# ---- cost tracking (same rates; separate DB so the extended run's cost is isolated) --
llm_price_in_per_1m_usd: 0.108
llm_price_out_per_1m_usd: 0.398
soniox_price_per_hour_usd: 0.70
inr_per_usd: 83.0
budget_inr_target: 5000.0

# Separate audit/cost DB so the extended run never touches the main corpus's records.
db_path: "data/thinkspark_runs_extended.db"
