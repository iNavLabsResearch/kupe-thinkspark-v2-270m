# ThinkSpark-v2-350M — LONG-turn data generation (~12-25 s user turns; additive).
#
# This is the EFFICIENT way to add many HOURS toward the 55 h target. Because each clip
# carries ~12-25 s of audio (vs ~5.5 s for extended, ~1-2 s for short), you reach a given
# hours target with roughly 1/3 the clips of the extended band => far fewer LLM calls and
# far fewer Soniox stream starts (so you stay well under the 100-starts/min limit), and it
# matches the guide's intended 20-30 s floor-control windows much better.
#
# It does NOT speed up rendering wall-time much: that is set by total AUDIO SECONDS to
# generate divided by your concurrent-stream limit (~3), not by the clip count — so ~40 h
# of audio is ~10 h of rendering at 3 concurrent regardless of clip length. To make THAT
# faster, raise your Soniox Console "Concurrent streams" limit and bump soniox_concurrency
# (see thinkspark/config.py).
#
# Only substantive change vs. data_gen.yaml is `utterance_length: long`. Runs into its OWN
# files/DB so nothing collides with the short or extended corpora:
#   python scripts/02_generate_scripts.py --config configs/data_gen_long.yaml \
#       --plan-dir data/plan_long --out-dir data/scenarios_long
#   python scripts/05_validate_data.py --in data/scenarios_long/scenarios_all.jsonl
#   python scripts/03_render_user_audio.py --config configs/data_gen_long.yaml \
#       --in data/scenarios_long/scenarios_all.jsonl --audio-dir data/audio_long
#   python scripts/00_encode_audio.py --config configs/data_gen_long.yaml \
#       --audio-dir data/audio_long --out-dir data/encoded
#   python scripts/04_build_frames.py --config configs/data_gen_long.yaml \
#       --in data/scenarios_long/scenarios_all.jsonl --audio-dir data/audio_long \
#       --frames-out data/frames/frames_long.jsonl
# (training globs data/frames/*.jsonl, so frames_long.jsonl joins the corpus automatically.)

# total_hours is THE size knob: scenarios = total_hours * 3600 / avg_window_seconds.
# At 18 s/clip: 10h->2k, 30h->6k, 40h->8k clips. This default targets ~33 h so that
# main (~7 h) + extended (~15 h) + long (~33 h) ~= 55 h total. Edit freely.
total_hours: 33.0               # ~6.6k long scenarios (~33 h of 12-25 s audio)
avg_window_seconds: 18.0        # mean of the 12-25 s long band (drives count<-hours)
utterance_length: long          # <-- the switch: long multi-sentence user_text

# ---- LLM (identical to data_gen_extended.yaml) ------------------------------
llm_model: "gemma-4-31b-it"
llm_base_url: "https://cloud.olakrutrim.com/v1"
llm_temperature: 0.9
llm_max_tokens: 2200            # higher — long multi-sentence user_text per item
llm_max_retries: 5
llm_concurrency: 30
batch_size: 10                  # slightly smaller batch — items are bigger

judge_model: "gemma-4-31b-it"

# ---- Soniox TTS (identical) -------------------------------------------------
soniox_ws_url: "wss://tts-rt.soniox.com/tts-websocket"
soniox_model: "tts-rt-v2"
soniox_sample_rate: 24000
soniox_max_retries: 5
soniox_concurrency: 3

mimi_repo: "kyutai/mimi"
mimi_sample_rate: 24000

num_parts: 8
seed: 1234

behaviour_shares: {}
language_shares: {}
domain_shares: {}

# ---- cost tracking (same rates; separate DB so the long run's cost is isolated) ------
llm_price_in_per_1m_usd: 0.108
llm_price_out_per_1m_usd: 0.398
soniox_price_per_hour_usd: 0.70
inr_per_usd: 83.0
budget_inr_target: 5000.0

db_path: "data/thinkspark_runs_long.db"
