# ThinkSpark-v2-350M — Phase 1 free-audio corpus plan (Section 7).
#
# Phase 1 teaches Gemma-3-270M that a stream of Mimi audio tokens carries language +
# prosody (close to the VAP task) — NOT full ASR, so we need far less than Whisper's
# 680k h, but 100h across three languages (v1's number) is too thin to be robust.
# Practical target from the guide: en 150h + hi 150h + gu 100-150h ~ 400-450h total.
# Cost = INR 0 in data — only free Kaggle GPU time to encode to Mimi (script 00).
#
# Every source below is free/open (CC0 or a click-through research license) and
# verified to exist on Hugging Face as of Aug 2026 — see README "Phase-1 sources" for
# the full citation list and why each one is in the mix.
#
# UPDATE (2026-08-29): mozilla-foundation/common_voice_* was pulled from Hugging Face
# entirely — "Effective October 2025, Mozilla Common Voice datasets are now exclusively
# available through Mozilla Data Collective" (confirmed live on HF, not a gating/token
# issue — the repo itself is empty, Viewer disabled, no loading script). It was used in
# en/hi/gu below; replaced/redistributed per language (see each source's own comment).

target_hours:
  en: 150
  hi: 150
  gu: 130          # PDF: gu 100-150h (scarcest of the three) — mid-high target, accept
                   # less if sources run dry; the plan already up-weights gu sources

# Aim for ~50/50 gender split (Section 7.3 — the codec does NOT remove bias, your data
# distribution does). Only enforced where the source actually carries a gender field —
# none of the current default sources reliably do (LibriSpeech/Kathbath/Shrutilipi/
# IndicTTS all lack one; FLEURS is small), so this gracefully no-ops for now and balance
# leans on speaker-count diversity instead. See the README/docs Phase-1 note.
gender_balance: true

sample_rate: 24000        # matches Mimi's operating rate (thinkspark.mimi_codec)
min_clip_seconds: 1.5     # drop clips too short to carry a real training window
max_clip_seconds: 20.0    # drop/trim clips longer than a Phase-2-sized window (Section 4)

# Pause downloads (P1_00_pipeline.py / P1_01_fetch_corpus.py) whenever free disk drops
# below this many GB, until the encoder frees space back up via wav-delete-after-encode.
# Real observed failure this guards against: on Kaggle's fast network, downloads (~92
# clips/sec across concurrent sources) can vastly outpace a single Mimi encoder's
# encode+delete rate (~2 clips/sec) — a fixed 90s periodic encode sweep alone can't drain
# a backlog growing that much faster than it empties, so the run died with
# `[Errno 28] No space left on device` (which then cascaded into every other error in
# that run's log — all downstream symptoms of this one root cause). 5.0GB leaves comfortable
# headroom on Kaggle's 57.6GiB session disk; raise it if a run still gets close to full,
# lower it (e.g. 2.0) only on a machine with much more disk to spare.
min_free_disk_gb: 5.0

# --------------------------------------------------------------------------------- #
# Sources per language. `weight` is this source's share of that language's
# target_hours (weights within a language should sum to ~1.0). `gated: true` means the
# dataset requires (a) an HF_TOKEN and (b) clicking "Agree" on the dataset's HF page
# once, in a browser, before the token can pull it — the script gives a clear error
# with the exact URL if you haven't done that yet.
# --------------------------------------------------------------------------------- #
sources:
  en:
    - id: librispeech
      hf_dataset: openslr/librispeech_asr
      hf_config: clean
      split: train.360             # ~360h nominal (104k rows) — plenty for a 0.60 weight slice.
                                    # NOT "train.clean.360" — the "clean" config's own splits are
                                    # named train.100/train.360/test/validation (no "clean." prefix
                                    # inside the split name itself; verified against the real error
                                    # HF returns: "Available splits: ['test', 'train.100',
                                    # 'train.360', 'validation']").
      gated: false                 # public, ungated, verified live and streamable
      weight: 0.60                 # replaces the now-dead common_voice slice (see file header)
      note: "~1000h public-domain read-speech audiobooks (LibriSpeech); no gender field — falls back to unlabeled, fine, gender_balance just skips it for this source"
    - id: fleurs
      hf_dataset: google/fleurs
      hf_config: en_us
      split: train
      gated: false
      weight: 0.40
      note: "clean, small, great HELD-OUT eval set — also usable for training volume"

  hi:
    # common_voice's 0.25 weight (dead — see file header) is redistributed proportionally
    # across the remaining three sources (kathbath/shrutilipi/fleurs were 0.35/0.30/0.10 =
    # 0.75 -> scaled up by 1/0.75 to sum back to 1.0, then rounded to clean numbers).
    - id: kathbath
      hf_dataset: ai4bharat/Kathbath
      hf_config: hindi
      split: train
      gated: false                 # CC0 — https://huggingface.co/datasets/ai4bharat/Kathbath
      weight: 0.45
      note: "1684h across 12 Indian languages, read+spontaneous, 203 districts"
    - id: shrutilipi
      hf_dataset: ai4bharat/Shrutilipi
      hf_config: hindi
      split: train
      gated: false                 # https://huggingface.co/datasets/ai4bharat/Shrutilipi
      weight: 0.40
      note: "6400h+ mined from All India Radio news bulletins — natural prosody"
    - id: fleurs
      hf_dataset: google/fleurs
      hf_config: hi_in
      split: train
      gated: false
      weight: 0.15
      note: "clean baseline slice"

  gu:
    # common_voice's 0.20 weight (dead — see file header) is redistributed across the
    # remaining three sources (kathbath/shrutilipi/indictts were 0.35/0.30/0.15 = 0.80 ->
    # scaled up by 1/0.80, then rounded to clean numbers).
    - id: kathbath
      hf_dataset: ai4bharat/Kathbath
      hf_config: gujarati
      split: train
      gated: false
      weight: 0.45
    - id: shrutilipi
      hf_dataset: ai4bharat/Shrutilipi
      hf_config: gujarati
      split: train
      gated: false
      weight: 0.35
    - id: indictts
      hf_dataset: SPRINGLab/IndicTTS_Gujarati
      hf_config: null
      split: train
      gated: false
      weight: 0.20
      note: "IIT-Madras studio-quality baseline (Section 7.2's 'IIT-M IndicTTS')"

# Optional, NOT in the default mix: ARTPARK-IISc/Vaani (31k h, 165 districts, huge
# accent spread — Section 7.2's "Vaani"). It's enormous relative to what's needed here,
# so it's left out of the default per-language targets above to keep Phase-1 storage/
# bandwidth bounded on Kaggle. Add it as an extra source with a small `weight` (e.g.
# 0.05-0.10) per language if you want more accent diversity and have the session budget.
