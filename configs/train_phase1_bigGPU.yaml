# Phase 1 — modality alignment, tuned for a BIG GPU (H100 / H200 / RTX6000 / Blackwell).
# Same recipe as configs/train_phase1.yaml, but sized for lots of VRAM + speed:
#   - big real batch (32) with little/no grad accumulation
#   - gradient checkpointing OFF (you have the memory; this is much faster)
#   - torch.compile ON, more dataloader workers
# On a 24GB L4 use configs/train_phase1.yaml instead (batch 4, grad_accum 16, checkpointing on).

phase: 1
base_model: "google/gemma-3-270m"
hf_token_env: "HF_TOKEN"

frames_dir: "data/frames_phase1"
encoded_dir: "data/encoded"
seq_len: 1024

optimizer: "adamw"
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
lr: 2.0e-4                 # Phase-1 LR (Section 9.4)
warmup_ratio: 0.03
batch_size: 32            # H100/H200/RTX6000/Blackwell have the VRAM; raise to 48-64 on 80GB
grad_accum: 2             # effective batch 64
epochs: 2
precision: "bf16"
grad_checkpointing: false # OFF on a big GPU = much faster (you have the VRAM)
frame_drop_aug: 0.05
label_smoothing: 0.0

use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lambda_vap: 0.3
vap_horizon: 25

out_dir: "artifacts/thinkspark-v2-350m/phase1"
log_every: 20
save_every: 500
seed: 1234
ddp: false                # multi-GPU: set true and launch with torchrun --nproc_per_node=N

# eval splits + W&B
val_frac: 0.02
test_frac: 0.01
eval_every: 500
wandb_project: "kupe-thinkspark-270m"
wandb_entity: null
wandb_run_name: null

# big-GPU speed
num_workers: 8
# torch.compile is OFF by default: real observed break on this transformers version —
# it combines `output_hidden_states=True` (which this model needs) with PEFT/LoRA
# wrapping via an internal "hidden states capture" hook, and Dynamo's graph-resume
# breaks that hook (`KeyError: 'hidden_states'` deep in transformers/utils/generic.py).
# Not a data/GPU issue — a library-version incompatibility. TF32 + bf16 + no grad-
# checkpointing + batch 32 already give most of the big-GPU speedup without it. Try
# `compile: true` again after a transformers upgrade if you want to chase the extra
# ~1.5-2x — the trainer catches a compile-time failure, but NOT this runtime one, so
# test it on a couple of steps before trusting a long run.
compile: false
attn_implementation: "sdpa"   # or "flash_attention_2" if you `pip install flash-attn`
