# Phase 1 — modality alignment, tuned for a BIG GPU (H100 / H200 / RTX6000 / Blackwell).
# Same recipe as configs/train_phase1.yaml, but sized for lots of VRAM + speed:
#   - big real batch (32) with little/no grad accumulation
#   - gradient checkpointing OFF (you have the memory; this is much faster)
#   - torch.compile ON, more dataloader workers
# On a 24GB L4 use configs/train_phase1.yaml instead (batch 4, grad_accum 16, checkpointing on).

phase: 1
base_model: "google/gemma-3-270m"
hf_token_env: "HF_TOKEN"

frames_dir: "data/frames_phase1"
encoded_dir: "data/encoded"
seq_len: 1024

optimizer: "adamw"
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
lr: 2.0e-4                 # Phase-1 LR (Section 9.4)
warmup_ratio: 0.03
batch_size: 48            # tail-only LM head (see thinkspark/model.py) frees a lot of
                          # VRAM vs computing 256K-vocab logits for the whole sequence, so
                          # an 80GB H100 fits 48 comfortably now. Drop to 32 if you OOM.
grad_accum: 1             # effective batch 48 in ONE forward/backward — fewer Python-loop
                          # steps than accumulating, so faster wall-clock on a big GPU.
epochs: 1                 # Phase-1 alignment is 1-2 epochs per the recipe. 1 epoch over
                          # ~165k samples (~400h audio) is a full, legitimate alignment
                          # pass — not a shortcut — and keeps this well under an hour on an
                          # H100. Bump to 2 if you want the extra polish and have the time.
precision: "bf16"
grad_checkpointing: false # OFF on a big GPU = much faster (you have the VRAM)
frame_drop_aug: 0.05
label_smoothing: 0.0

# FULL fine-tune, NOT LoRA. Two reasons, both learned the hard way:
#   1. A 270M model full-finetunes in a few GB on a 96GB card — LoRA was only ever here
#      for the 24GB L4 / 2xT4 path. There is no memory reason to accept its lower capacity.
#   2. LoRA here silently BROKE the Phase-1 -> Phase-2 handoff: peft renames every
#      backbone key (backbone.base_model.model.model.layers...), Phase 2 is a full
#      finetune expecting plain keys (backbone.model.layers...), and its
#      load_state_dict(strict=False) matched almost nothing — reported only as
#      "missing=237, unexpected=489". Phase 2 trained from base Gemma and threw away all
#      of Phase 1. Full-finetuning both phases makes the key layouts identical.
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lambda_vap: 0.05          # DELIBERATELY TINY. The Phase-1 corpus is continuous speech
                          # clips, so scripts/P1_02_build_frames.py sets speaking_mask =
                          # all 1s -> the VAP target is a CONSTANT. There is nothing to
                          # learn, and weighting it heavily (an earlier version of this
                          # file used 5.0) actively teaches the head to always output
                          # "speaking", a bias Phase 2 then has to undo. Kept non-zero only
                          # so the head's weights stay in a sane range. VAP is genuinely
                          # trained in PHASE 2, where speaking_mask has real negatives.
vap_horizon: 25

out_dir: "artifacts/thinkspark-v2-350m/phase1"
log_every: 20
save_every: 500
seed: 1234
ddp: false                # multi-GPU: set true and launch with torchrun --nproc_per_node=N

# eval splits + W&B
val_frac: 0.02
test_frac: 0.01
eval_every: 250
save_best: true            # keep best/ at the min val loss — warm-start Phase 2 from THIS
early_stop_patience: 6     # stop after 6 evals with no val gain (0 = off)
early_stop_min_delta: 0.0
wandb_project: "kupe-thinkspark-270m"
wandb_entity: null
wandb_run_name: null

# big-GPU speed
num_workers: 8
# torch.compile is OFF by default: real observed break on this transformers version —
# it combines `output_hidden_states=True` (which this model needs) with PEFT/LoRA
# wrapping via an internal "hidden states capture" hook, and Dynamo's graph-resume
# breaks that hook (`KeyError: 'hidden_states'` deep in transformers/utils/generic.py).
# Not a data/GPU issue — a library-version incompatibility. TF32 + bf16 + no grad-
# checkpointing + batch 32 already give most of the big-GPU speedup without it. Try
# `compile: true` again after a transformers upgrade if you want to chase the extra
# ~1.5-2x — the trainer catches a compile-time failure, but NOT this runtime one, so
# test it on a couple of steps before trusting a long run.
compile: false
attn_implementation: "sdpa"   # or "flash_attention_2" if you `pip install flash-attn`
