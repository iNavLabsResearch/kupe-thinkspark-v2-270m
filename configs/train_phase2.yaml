# Phase 2 — referee fine-tune (Section 9). Per-frame control flag (focal) + spoken text
# (masked CE) + VAP aux on the ~55 h synthetic corpus. Warm-start from Phase-1 (--init).

phase: 2
base_model: "google/gemma-3-270m"
hf_token_env: "HF_TOKEN"

frames_dir: "data/frames"
encoded_dir: "data/encoded"
seq_len: 1024

optimizer: "adamw"
weight_decay: 0.1
lr: 1.0e-4                 # Phase-2 LR (Section 9.4)
warmup_ratio: 0.03
batch_size: 4             # same reasoning as Phase-1 (256K-vocab CE is the memory driver
                          # on a 24GB L4) — 4 is the safe default; raise if VRAM allows.
grad_accum: 16            # effective batch 64
epochs: 8                 # upper bound; early stopping on ctrl_macro_f1_tol
                          # ends the run when the referee stops improving
precision: "bf16"
grad_checkpointing: true
frame_drop_aug: 0.05

use_lora: false           # full fine-tune fits 2xT4 in bf16 (Section 9.3)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# L_P2 = l_ctrl*L_ctrl + l_txt*L_txt + l_vap*L_vap   (Section 9.1: 1.0, 0.5, 0.2)
# Same rebalance + control-head shaping as configs/train_phase2_bigGPU.yaml — read the
# comments there for the measured numbers behind each value. Kept in sync deliberately:
# the fix is about the loss/label geometry, not about GPU size.
lambda_ctrl: 20.0
lambda_txt: 0.1
lambda_vap_p2: 1.0
focal_gamma: 2.0
vap_horizon: 25
ctrl_event_width: 1.0
ctrl_alpha_power: 0.75
ctrl_alpha_max_ratio: 50.0
vap_pos_weight: 0.0
eval_tolerance_frames: 3
save_best: true
best_metric: "ctrl_macro_f1_tol"
early_stop_patience: 10
eval_every: 250

out_dir: "artifacts/thinkspark-v2-350m/phase2"
log_every: 20
save_every: 500
seed: 1234
ddp: false

# eval splits + Weights & Biases logging
val_frac: 0.02
test_frac: 0.01
eval_every: 500
wandb_project: "kupe-thinkspark-270m"
wandb_entity: null
wandb_run_name: null
