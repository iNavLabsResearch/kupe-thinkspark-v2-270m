# Phase-2 referee fine-tune, sized for a big single GPU (RTX PRO 6000 Blackwell, 96 GB)
# and tuned to STOP BEFORE OVERFITTING.
#
# Why this differs from the previous version of this file:
#   Your last run (4 epochs, no smoothing, no best-checkpoint tracking) hit its val-loss
#   minimum around step ~800 (~2 epochs) and then val/loss + val/txt climbed back up while
#   train/loss kept dropping — textbook overfit — and you ended up evaluating the LAST
#   (worst) checkpoint. The changes below fix that at the recipe level:
#     - epochs 4 -> 3, but early stopping ends the run once val stops improving
#     - save_best keeps a `best/` checkpoint at the val-loss minimum (evaluate THAT)
#     - eval_every 500 -> 250 so best/ + early stop are fine-grained
#     - label_smoothing 0.1 regularizes the spoken-text CE (now wired into Phase2Loss)
#     - weight_decay 0.1 kept; frame_drop_aug 0.05 kept
#
# On a 24 GB L4 use configs/train_phase2.yaml instead (batch 4, grad_accum 16, checkpointing on).

phase: 2
base_model: "google/gemma-3-270m"
hf_token_env: "HF_TOKEN"

frames_dir: "data/frames"    # cosmetic only, unused at runtime — actual shard glob comes from --frames
encoded_dir: "data/encoded"
seq_len: 1024

optimizer: "adamw"
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
lr: 1.0e-4                 # Phase-2 LR
warmup_ratio: 0.03
batch_size: 64            # tail-only LM head keeps VRAM modest; 64 fits comfortably in
                          # 96 GB. Drop to 48/32 only if you OOM.
grad_accum: 1             # effective batch 64
epochs: 8                 # was 3. Run 20260901-214336 stopped at step ~850 (2 epochs)
                          # with the rare control flags still climbing (val/f1/TURN_END was
                          # 0.01 -> 0.13 and still rising at the last eval; SILENCE_BREAK,
                          # PREFETCH_LLM likewise). Early stopping on ctrl_macro_f1_tol
                          # ends the run when the referee actually stops improving instead
                          # of when the (text-dominated) epoch budget runs out.
precision: "bf16"
grad_checkpointing: false # OFF on a big GPU = much faster (you have the VRAM)
frame_drop_aug: 0.05
label_smoothing: 0.1      # regularizes the spoken-text CE (a driver of the val/txt turn-up)

use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# L_P2 = l_ctrl*L_ctrl + l_txt*L_txt + l_vap*L_vap
#
# THE most important numbers in this file. The guide's nominal (1.0, 0.5, 0.2) assumes the
# three terms are on comparable scales. They are NOT. Measured from a real run at step 680:
#
#     ctrl=0.0079  txt=2.3339  vap=0.0200
#     -> 1.0*0.0079 = 0.0079  =  0.67% of the loss
#     -> 0.5*2.3339 = 1.1669  = 98.82% of the loss   <-- text ate everything
#     -> 0.3*0.0200 = 0.0060  =  0.51% of the loss
#
# The control head — the ENTIRE point of a referee model — was getting 0.67% of the
# gradient. That is why TURN_END scored F1=0.20, BARGE_SOFT F1=0.05, COMMIT_LLM F1=0.09:
# those heads were never meaningfully trained. Focal loss makes it worse by design (it
# down-weights the easy majority frames toward zero), so its absolute value stays tiny.
#
# Rebalanced so control DOMINATES and text is the auxiliary it should be:
#     20.0*0.008 = 0.16   (~41%)     0.1*2.33 = 0.23   (~59%)
lambda_ctrl: 20.0         # was 1.0
lambda_txt: 0.1           # was 0.5 — back-channel text is secondary to the flags
lambda_vap_p2: 1.0        # was 0.2. NOTE: the VAP head reading VAD-F1 0.000 was NOT a
                          # weighting problem — it was fed the wrong target entirely
                          # (thinkspark/dataset.py built it from `speaking_mask`, the
                          # back-channel-TEXT mask, ~0.3% positive). That is fixed; this
                          # weight now trains a head with a real target behind it.
focal_gamma: 2.0
vap_horizon: 25

# ---- control-head shaping (the actual fix for TURN_END/BARGE/*_LLM F1 ~0.1) ----------
# Every rare flag is laid down on exactly ONE 80 ms frame, so per-frame argmax scoring
# gives F1=0 to a referee that fires 80 ms early. `ctrl_event_width` widens those point
# events into short decision WINDOWS during training (widths in
# thinkspark/frames.py:_EVENT_WIDTH_FRAMES; 1.0 = as listed, e.g. TURN_END -2/+3 frames
# = a 480 ms window). This both gives the head real positive mass to learn from and
# stops punishing near-misses.
ctrl_event_width: 1.0
# Focal alpha ∝ (1/freq)**power. 0.5 (plain 1/sqrt) barely separates a 71%-of-frames
# LISTEN from a 0.2% TURN_END; 0.75 does, without the over-firing that full inverse
# frequency (1.0) causes.
ctrl_alpha_power: 0.75
ctrl_alpha_max_ratio: 50.0   # cap alpha_max/alpha_min so one ultra-rare flag can't
                             # dominate the whole gradient
vap_pos_weight: 0.0          # real speaking rate is ~0.6-0.8 — no rebalancing needed
eval_tolerance_frames: 3     # ±240 ms collar for the tolerant control metric

out_dir: "artifacts/thinkspark-v2-350m/phase2"
log_every: 20
save_every: 500
seed: 1234
ddp: false                # multi-GPU: set true and launch with torchrun --nproc_per_node=N

# eval splits + best-checkpoint tracking + early stopping
val_frac: 0.02
test_frac: 0.01
eval_every: 100           # ~286 steps/epoch, so this gives ~11 evals over the run —
                          # enough resolution for best/ to catch the real optimum
save_best: true           # write best/ at the best metric — EVALUATE best/, not final/
# Select on the REFEREE's quality, not the total loss. The total loss is dominated by the
# text term even after rebalancing, so "min val loss" picks the best text model. Macro F1
# over the 11 control flags is what scripts/08_evaluate.py actually grades.
# ...and score it with the ±3-frame collar, not exact-frame: exact-frame macro F1 on
# single-frame events mostly measures whether the model guessed the exact 80 ms tick.
best_metric: "ctrl_macro_f1_tol"
early_stop_patience: 10   # was 6. With ~286 steps/epoch and eval_every 100, 6 evals is
                          # only 600 steps of patience — short enough that a rare flag's
                          # slow climb can look like a plateau. 10 evals = 1000 steps.
early_stop_min_delta: 0.0

# W&B
wandb_project: "kupe-thinkspark-270m"
wandb_entity: null
wandb_run_name: null

# big-GPU speed
num_workers: 8
compile: false                # see train_phase1_bigGPU.yaml comment (Dynamo + PEFT/hidden_states break)
attn_implementation: "sdpa"   # or "flash_attention_2" if you `pip install flash-attn`
